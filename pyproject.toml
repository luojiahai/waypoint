[project]
name = "waypoint"
version = "0.1.0"
description = "Local delivery and people dashboard for an engineering manager"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "typer>=0.12",
]

[project.scripts]
waypoint = "waypoint.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waypoint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
